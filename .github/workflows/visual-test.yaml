name: Visual Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  visual-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Playwright
        run: npx playwright install --with-deps

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-noto-color-emoji fonts-noto-cjk fonts-dejavu-core fonts-freefont-ttf fonts-roboto

      - name: Install Roboto Condensed font
        run: |
          mkdir -p ~/.local/share/fonts
          wget -O ~/.local/share/fonts/RobotoCondensed-Regular.ttf "https://fonts.gstatic.com/s/robotocondensed/v25/ieVl2ZhZI2eCN5jzbjEETS9weq8-19K7CA.ttf"
          wget -O ~/.local/share/fonts/RobotoCondensed-Bold.ttf "https://fonts.gstatic.com/s/robotocondensed/v25/ieVl2ZhZI2eCN5jzbjEETS9weq8-19K7Cw.ttf"
          fc-cache -f -v

      - name: Get branch name
        id: branch-name
        run: |
          # Extract branch name from the PR head ref
          BRANCH_NAME="${{ github.head_ref }}"
          # Clean branch name for URL (replace special characters)
          CLEAN_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          echo "branch-name=$CLEAN_BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "original-branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Set up test environment
        run: |
          # Set the base URL for the deployed sidekick
          echo "BASE_URL=https://${{ steps.branch-name.outputs.branch-name }}--aem-visual-cheker--acs-ui.aem.page" >> $GITHUB_ENV
          echo "Using base URL: $BASE_URL"

      - name: Wait for deployment
        run: |
          # Wait for the deployment to be available
          echo "Waiting for deployment to be available..."
          for i in {1..15}; do
            if curl -f -s "$BASE_URL" > /dev/null; then
              echo "Deployment is available!"
              break
            fi
            echo "Attempt $i: Deployment not ready yet, waiting..."
            sleep 20
          done

      - name: Run visual tests
        run: |
          echo "Running visual tests against: $BASE_URL"
          npm run test:visual -- --workers=2
        env:
          BASE_URL: ${{ env.BASE_URL }}
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 30

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            let comment = `## Visual Test Results for PR #${{ github.event.number }}\n\n`;
            comment += `**Branch:** ${{ steps.branch-name.outputs.original-branch }}\n`;
            comment += `**Test URL:** ${{ env.BASE_URL }}\n\n`;
            
            // Check if tests passed or failed
            const testExitCode = '${{ job.status }}' === 'success' ? 0 : 1;
            
            if (testExitCode === 0) {
              comment += `✅ **Visual tests passed successfully!**\n\n`;
              comment += `All visual regression tests have passed. The component changes look good.`;
            } else {
              comment += `❌ **Visual tests failed!**\n\n`;
              comment += `Some visual regression tests have failed. Please review the test results and update baseline images if needed.\n\n`;
              comment += `**Next steps:**\n`;
              comment += `1. Download the test artifacts to view detailed results\n`;
              comment += `2. Review the failed screenshots in the playwright-report\n`;
              comment += `3. If the changes are intentional, update the baseline images\n`;
              comment += `4. Re-run the tests to verify fixes`;
            }
            
            comment += `\n\n---\n`;
            comment += `*This comment was automatically generated by the visual test workflow.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            }); 