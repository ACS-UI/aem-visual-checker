name: Visual Tests

on:
  pull_request:
    branches:
      - main
      - 'visual-test*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  visual-tests:
    # Run inside the same image used to generate baselines locally so
    # font rendering is pixel-identical between local Docker and CI.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.53.1-jammy
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Install AEM CLI
        run: npm install -g @adobe/aem-cli

      # Browsers are pre-installed in the playwright image — no install needed.

      - name: Run visual tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tools/visual-tests/playwright-report/
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tools/visual-tests/test-results/
          retention-days: 3
